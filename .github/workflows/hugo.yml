name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    env:
      HUGO_VERSION: 0.165.0

    steps:
      - name: Check GitHub Pages setup
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o "$RUNNER_TEMP/pages.json" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$status" = "200" ]; then
            build_type=$(jq -r '.build_type // ""' "$RUNNER_TEMP/pages.json")
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=GitHub Pages setup needed::Open Settings > Pages and set Build and deployment > Source to GitHub Actions, then rerun this workflow."
            fi
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages setup needed::Open Settings > Pages and set Build and deployment > Source to GitHub Actions, then rerun this workflow."
          else
            cat "$RUNNER_TEMP/pages.json"
            echo "::error::Unable to check GitHub Pages configuration (HTTP $status)."
            exit 1
          fi

      - name: Install Hugo CLI
        if: steps.pages-check.outputs.enabled == 'true'
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup Pages
        if: steps.pages-check.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        if: steps.pages-check.outputs.enabled == 'true'
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
